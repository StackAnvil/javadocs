name: Publish StackAnvil Javadocs

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: javadocs-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Generate docs for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish.ts
      - name: Commit generated docs
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site published.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'docs(javadocs): publish latest StackAnvil release'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: site
      - uses: actions/deploy-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        id: deployment
